<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  @font-face { font-family: 'Fredoka'; font-weight: 500; src: url('fonts/fredoka-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fredoka'; font-weight: 600; src: url('fonts/fredoka-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url('fonts/fredoka-latin-700-normal.woff2') format('woff2'); }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="engine/core.js"></script>
<script src="engine/bear.js"></script>
<script src="engine/props.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/sets2.js"></script>
<script>
  // Loads the skit named in ?skit=, then exposes renderFrame(t) for render.js.
  const skitName = new URLSearchParams(location.search).get('skit');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  window.addEventListener('error', (e) => { window.LOAD_ERROR = String(e.message) + ' @' + e.filename + ':' + e.lineno; });
  const s = document.createElement('script');
  s.src = 'skits/' + skitName + '.js';
  s.onerror = () => { window.LOAD_ERROR = 'cannot load skit ' + skitName; };
  s.onload = async () => {
    try {
      await Promise.all([
        document.fonts.load('900 64px Inter'),
        document.fonts.load('800 64px Inter'),
        document.fonts.load('700 64px Inter'),
        document.fonts.load('64px "Noto Color Emoji"', '😴❤️'),
        document.fonts.load('600 64px Fredoka'),
        document.fonts.load('700 64px Fredoka'),
      ]);
      const skit = window.SKIT;
      skit.build();
      window.skitMeta = () => skit.meta();
      window.renderFrame = (t, type) => {
        skit.render(ctx, t);
        return canvas.toDataURL(type || 'image/jpeg', 0.94).split(',')[1];
      };
      window.READY = true;
    } catch (e) {
      window.LOAD_ERROR = String(e && e.stack || e);
    }
  };
  document.body.appendChild(s);
</script>
</body>
</html>
